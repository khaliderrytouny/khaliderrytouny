name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: khaliderrytouny

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300E5FF&color_dots=%23000000,%23051A2B,%23006680,%2300B8D9,%2300E5FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300E5FF&color_dots=%23000000,%23051A2B,%23006680,%2300B8D9,%237C3AED

      - name: Push Snake

        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
